name: "Auto compile with OpenWrt SDK"

on:
  push:
    branches: [ main, openwrt ]
    paths:
      - "Makefile"
  pull_request:
    branches: [ main, openwrt ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - aarch64_generic

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  job_check:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      lumos_version: ${{ steps.check_version.outputs.latest_version }}
      has_update: ${{ steps.check_version.outputs.has_update }}
      branch_suffix: ${{ steps.check_version.outputs.branch_suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
      - name: Check version
        id: check_version
        env:
          url_release: https://api.github.com/repos/${{ github.repository }}/releases/latest
        run: |
          latest_version=$(grep -oP 'PKG_VERSION:=\K.*' Makefile | sed 's/^/v/')
          latest_release=$(wget -qO- -t1 -T2 ${{env.url_release}} | awk -F '"' '/tag_name/{print $4}')
          
          if [[ "${{ github.ref }}" == "refs/heads/openwrt" ]]; then
            branch_suffix="-openwrt"
          else
            branch_suffix="-legacy"
          fi
          
          tag_to_check="${latest_version}${branch_suffix}"
          has_update=$([ "${tag_to_check}" != "${latest_release}" ] && echo true || echo false)
          
          echo "latest_version=${latest_version}" >> $GITHUB_OUTPUT
          echo "has_update=${has_update}" >> $GITHUB_OUTPUT
          echo "branch_suffix=${branch_suffix}" >> $GITHUB_OUTPUT
          echo "tag_to_check=${tag_to_check}"
          echo "latest_release=${latest_release}"
          echo "has_update=${has_update}"
      - name: Generate new tag & release
        if: steps.check_version.outputs.has_update == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.check_version.outputs.latest_version }}${{ steps.check_version.outputs.branch_suffix }}
          tag_name: ${{ steps.check_version.outputs.latest_version }}${{ steps.check_version.outputs.branch_suffix }}

  job_build_lumos:
    name: Build LumOS
    needs: job_check
    if: needs.job_check.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install packages
        run: |
          echo "Install packages"
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install zstd build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-venv rsync unzip zlib1g-dev file wget
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Determine SDK URL based on branch
        id: sdk_url
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/openwrt" ]]; then
            echo "SDK_URL=https://archive.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst" >> $GITHUB_OUTPUT
            echo "SDK_CACHE_KEY=openwrt-sdk-24.10-x86-64" >> $GITHUB_OUTPUT
            echo "SDK_BRANCH=master" >> $GITHUB_OUTPUT
          else
            echo "SDK_URL=https://archive.openwrt.org/releases/19.07.10/targets/x86/64/openwrt-sdk-19.07.10-x86-64_gcc-7.5.0_musl.Linux-x86_64.tar.xz" >> $GITHUB_OUTPUT
            echo "SDK_CACHE_KEY=openwrt-sdk-19.07-x86-64" >> $GITHUB_OUTPUT
            echo "SDK_BRANCH=openwrt-19.07" >> $GITHUB_OUTPUT
          fi

      - name: Cache openwrt SDK
        id: cache-sdk
        uses: actions/cache@v3
        with:
          path: sdk
          key: ${{ steps.sdk_url.outputs.SDK_CACHE_KEY }}

      - name: Initialization environment
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        env:
          url_sdk: ${{ steps.sdk_url.outputs.SDK_URL }}
        run: |
          wget ${{ env.url_sdk }}
          file_name=$(echo ${{env.url_sdk}} | awk -F/ '{print $NF}')
          mkdir sdk && tar --zstd -xvf $file_name -C ./sdk --strip-components=1 2>/dev/null || tar -xvf $file_name -C ./sdk --strip-components=1
          cd sdk
          echo "src-git base https://github.com/openwrt/openwrt.git;${{ steps.sdk_url.outputs.SDK_BRANCH }}" > feeds.conf
          echo "src-git-full packages https://github.com/openwrt/packages.git;master" >> feeds.conf
          echo "src-git-full luci https://github.com/openwrt/luci.git;master" >> feeds.conf
          echo "src-git-full routing https://git.openwrt.org/feed/routing.git;master" >> feeds.conf
          git clone -b ${{ github.ref_name }} https://github.com/${{ github.repository }}.git package/downloads/luci-theme-lumos
          ./scripts/feeds update -a
          echo "CONFIG_PACKAGE_luci-theme-lumos=m" > .config
          ./scripts/feeds install -d n luci-theme-lumos
          make download -j8

      - name: Configure LumOS
        run: |
          cd sdk
          ./scripts/feeds install luci-theme-lumos
          echo "CONFIG_ALL_NONSHARED=n" > .config
          echo "CONFIG_ALL_KMODS=n" >> .config
          echo "CONFIG_ALL=n" >> .config
          echo "CONFIG_AUTOREMOVE=n" >> .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-lumos=m" >> .config
          make defconfig

      - name: Compile LumOS
        id: compile
        run: |
          cd sdk
          echo "make package/luci-theme-lumos/{clean,compile} -j$(nproc)"
          make package/luci-theme-lumos/{clean,compile} -j$(nproc)
          mv bin/packages/x86_64/base/ ../
          rm .config .config.old
          cd ..
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload LumOS packages to release
        uses: softprops/action-gh-release@v2
        if: steps.compile.outputs.status == 'success'
        with:
          tag_name: ${{ needs.job_check.outputs.lumos_version }}${{ needs.job_check.outputs.branch_suffix }}
          files: ${{ env.FIRMWARE }}/base/luci-theme*.*
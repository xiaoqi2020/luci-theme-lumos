name: Build OpenWrt Package

on:
  push:
    branches: [ main, openwrt ]
  pull_request:
    branches: [ main, openwrt ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - arm_cortex-a9
          - aarch64_generic

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        path: luci-theme-lumos

    - name: Determine build configuration
      id: config
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/openwrt" ]]; then
          echo "BRANCH=openwrt" >> $GITHUB_OUTPUT
          echo "OPENWRT_REF=main" >> $GITHUB_OUTPUT
          echo "PKG_PATTERN=luci-theme-lumos-*.apk" >> $GITHUB_OUTPUT
          echo "PKG_FALLBACK=luci-theme-lumos_*.ipk" >> $GITHUB_OUTPUT
          echo "TAG_SUFFIX=-openwrt" >> $GITHUB_OUTPUT
          echo "RELEASE_NAME=LumOS Theme v1.1.0 (OpenWrt 24.x+)" >> $GITHUB_OUTPUT
          echo "ARTIFACT_SUFFIX=-openwrt" >> $GITHUB_OUTPUT
        else
          echo "BRANCH=legacy" >> $GITHUB_OUTPUT
          echo "OPENWRT_REF=openwrt-19.07" >> $GITHUB_OUTPUT
          echo "PKG_PATTERN=luci-theme-lumos_*.ipk" >> $GITHUB_OUTPUT
          echo "PKG_FALLBACK=" >> $GITHUB_OUTPUT
          echo "TAG_SUFFIX=-legacy" >> $GITHUB_OUTPUT
          echo "RELEASE_NAME=LumOS Theme v1.0.0 (OpenWrt 18.06)" >> $GITHUB_OUTPUT
          echo "ARTIFACT_SUFFIX=-legacy" >> $GITHUB_OUTPUT
        fi

    - name: Set up environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
          zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip python3 \
          python3-distutils python3-setuptools rsync flex bison patch curl \
          bc

    - name: Clone OpenWrt ${{ steps.config.outputs.BRANCH }} branch
      uses: actions/checkout@v4
      with:
        repository: openwrt/openwrt
        ref: ${{ steps.config.outputs.OPENWRT_REF }}
        path: openwrt
        fetch-depth: 1

    - name: Copy theme to package directory
      run: |
        cd openwrt
        rm -rf package/luci-theme-lumos
        cp -r ../luci-theme-lumos package/luci-theme-lumos

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

    - name: Install luci feeds
      run: |
        cd openwrt
        ./scripts/feeds install luci-base

    - name: Configure build for x86_64
      if: ${{ github.event.inputs.target == 'x86_64' || !github.event.inputs.target }}
      run: |
        cd openwrt
        rm -f .config
        echo "CONFIG_TARGET_x86=y" > .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_Generic=y" >> .config
        echo "CONFIG_PACKAGE_luci-theme-lumos=y" >> .config
        echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config

    - name: Configure build for arm_cortex-a9
      if: ${{ github.event.inputs.target == 'arm_cortex-a9' }}
      run: |
        cd openwrt
        rm -f .config
        echo "CONFIG_TARGET_ath79=y" > .config
        echo "CONFIG_TARGET_ath79_generic=y" >> .config
        echo "CONFIG_PACKAGE_luci-theme-lumos=y" >> .config
        echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config

    - name: Configure build for aarch64_generic
      if: ${{ github.event.inputs.target == 'aarch64_generic' }}
      run: |
        cd openwrt
        rm -f .config
        echo "CONFIG_TARGET_armvirt=y" > .config
        echo "CONFIG_TARGET_armvirt_64=y" >> .config
        echo "CONFIG_PACKAGE_luci-theme-lumos=y" >> .config
        echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config

    - name: Build toolchain
      run: |
        cd openwrt
        make defconfig
        make toolchain/install -j$(nproc) V=s 2>&1 | tail -50

    - name: Build luci-theme-lumos
      run: |
        cd openwrt
        make package/luci-theme-lumos/compile V=s -j$(nproc) 2>&1

    - name: Find built package
      id: find_package
      run: |
        cd openwrt
        PACKAGE_PATH=$(find bin -name "${{ steps.config.outputs.PKG_PATTERN }}" | head -1)
        if [ -z "$PACKAGE_PATH" ] && [ -n "${{ steps.config.outputs.PKG_FALLBACK }}" ]; then
          echo "Trying fallback pattern..."
          PACKAGE_PATH=$(find bin -name "${{ steps.config.outputs.PKG_FALLBACK }}" | head -1)
        fi
        if [ -z "$PACKAGE_PATH" ]; then
          echo "Package not found!"
          exit 1
        fi
        echo "package_path=$PACKAGE_PATH" >> $GITHUB_OUTPUT
        echo "Found package: $PACKAGE_PATH"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: luci-theme-lumos-${{ github.event.inputs.target || 'x86_64' }}${{ steps.config.outputs.ARTIFACT_SUFFIX }}
        path: openwrt/${{ steps.find_package.outputs.package_path }}

    - name: Create Release for openwrt branch
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/openwrt' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.0${{ steps.config.outputs.TAG_SUFFIX }}
        name: ${{ steps.config.outputs.RELEASE_NAME }}
        body: |
          **LumOS Theme** - OpenWrt LuCI theme for OpenWrt 24.x+

          **Version**: 1.1.0

          **Installation**:
          ```bash
          # For APK-based systems (OpenWrt 24.x+)
          apk add luci-theme-lumos-*.apk
          ```
        draft: false
        prerelease: false
        files: openwrt/${{ steps.find_package.outputs.package_path }}

    - name: Create Release for legacy branch
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0${{ steps.config.outputs.TAG_SUFFIX }}
        name: ${{ steps.config.outputs.RELEASE_NAME }}
        body: |
          **LumOS Theme** - OpenWrt LuCI theme for OpenWrt 18.06

          **Version**: 1.0.0

          **Installation**:
          ```bash
          opkg install luci-theme-lumos_*.ipk
          ```
        draft: false
        prerelease: false
        files: openwrt/${{ steps.find_package.outputs.package_path }}